<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SentenceMiner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="summon-body">
    <div id="dim" class="dim" hidden>
      <div class="summon-card" role="dialog" aria-modal="true" aria-labelledby="field-label">
        <p id="step-indicator" class="eyebrow">1/3 · Frase</p>
        <div id="context" class="context" hidden></div>
        <label id="field-label" class="label" for="field-sentence">Frase</label>
        <textarea
          id="field-sentence"
          class="text-area summon-field"
          rows="3"
          spellcheck="false"
        ></textarea>
        <input
          id="field-term"
          class="text-input summon-field"
          autocomplete="off"
          spellcheck="false"
          hidden
        />
        <div id="front-preview" class="front-preview" hidden></div>
        <textarea
          id="field-back"
          class="text-area summon-field"
          rows="5"
          spellcheck="false"
          hidden
        ></textarea>
        <div class="summon-actions">
          <button id="btn-advance" class="primary-action">Avançar</button>
        </div>
        <p class="hint">Ctrl+Enter avança · Enter quebra linha · Esc cancela</p>
        <p id="status" class="status">Status: aguardando...</p>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
