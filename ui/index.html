<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SentenceMiner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="summon-body">
    <div id="dim" class="dim" hidden>
      <div class="summon-card" role="dialog" aria-modal="true" aria-labelledby="field-label">
        <p id="step-indicator" class="eyebrow">1/3 · Frase</p>
        <label id="field-label" class="label" for="field">Frase</label>
        <input
          id="field"
          class="text-input summon-field"
          autocomplete="off"
          spellcheck="false"
        />
        <textarea
          id="area"
          class="text-area summon-field"
          rows="5"
          spellcheck="false"
          hidden
        ></textarea>
        <p class="hint">Enter avança · Shift+Enter quebra linha · Esc cancela</p>
        <p id="status" class="status">Status: aguardando...</p>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
